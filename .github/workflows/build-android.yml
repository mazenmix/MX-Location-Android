name: Build MX Location Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Collect signing tools
        run: |
          mkdir -p signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-tools/zipalign

      - name: Upload unsigned APK and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: mx-location-android-build
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            signing-tools/apksigner.jar
            signing-tools/zipalign
          if-no-files-found: error
