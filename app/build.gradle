plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mazenmix.mxlocation'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mazenmix.mxlocation'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.1.1'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// MX Location Android build configuration — v1.1.1.
